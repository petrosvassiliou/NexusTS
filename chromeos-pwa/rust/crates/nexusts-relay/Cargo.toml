[package]
name = "nexusts-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nexusts-local-relay"
path = "src/main.rs"

[dependencies]
nexusts-crypto = { path = "../../../../native/rust/crates/nexusts-crypto" }
nexusts-terminal = { path = "../../../../native/rust/crates/nexusts-terminal" }
nexusts-transfer = { path = "../../../../native/rust/crates/nexusts-transfer" }
nexusts-netutils = { path = "../../../../native/rust/crates/nexusts-netutils" }
tokio = { version = "1.43", features = ["rt-multi-thread", "rt", "net", "io-util", "time", "sync", "macros", "process"] }
russh = "0.49"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
