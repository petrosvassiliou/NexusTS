[workspace]
resolver = "2"
members = [
    "crates/nexusts-wasm",
    "crates/nexusts-relay",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "Proprietary"
authors = ["NexusTS Systems Architecture Team <engineering@nexusts.app>"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
