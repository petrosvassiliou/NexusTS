org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Googlebook OS & Tablet high-performance 16KB page size alignment (Android 15/16+)
nexusts.ndk.abis=arm64-v8a,x86_64
nexusts.minSdk=29
nexusts.targetSdk=35
nexusts.compileSdk=35

# Optional build-time Google Cloud OAuth 2.0 Web Client ID (can also be set via NEXUSTS_GOOGLE_WEB_CLIENT_ID env var or MDM)
nexusts.google.webClientId=
