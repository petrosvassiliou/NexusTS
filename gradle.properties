org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Googlebook OS & Tablet high-performance 16KB page size alignment (Android 15/16+)
nexusts.ndk.abis=arm64-v8a,x86_64
nexusts.minSdk=29
nexusts.targetSdk=36
nexusts.compileSdk=36
