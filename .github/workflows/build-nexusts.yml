name: NexusTS Native NDK & Android Release CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      compile_full_freerdp3:
        description: "Cross-compile full OpenSSL 3.4 + libusb + FreeRDP 3.12 NDK shared libraries"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Publish signed APK & AAB to GitHub Releases"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Tag name when publishing via workflow_dispatch"
        required: false
        default: "v0.8.11"
        type: string

permissions:
  contents: read

concurrency:
  group: nexusts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "28.0.13004108"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "8.13"

jobs:
  rust-ndk-protocols:
    name: Rust Crypto & SSH/SFTP NDK (arm64-v8a, x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NexusTS
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo Registry & Target Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/rust -> target"

      - name: Run Rust Unit Tests (Argon2id + AES-256-GCM + SSH/SFTP/NetUtils)
        working-directory: native/rust
        run: cargo test --workspace --locked

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "ndk;${ANDROID_NDK_VERSION}"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build 16 KB Page-Aligned libnexusts_jni.so (arm64-v8a & x86_64)
        working-directory: native/rust
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          mkdir -p ../../app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            --platform 29 \
            -o ../../app/src/main/jniLibs \
            build -p nexusts-jni --release --locked

      - name: Upload Rust JNI Shared Libraries
        uses: actions/upload-artifact@v4
        with:
          name: nexusts-rust-jnilibs
          path: app/src/main/jniLibs/
          if-no-files-found: error

  cpp-freerdp-bridge:
    name: C++20 FreeRDP NDK Bridge Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NexusTS
        uses: actions/checkout@v4

      - name: Strict C++20 Host Syntax & Warning Audit
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -I native/cpp/include \
            native/cpp/rdp/rdp_session_context.cpp \
            native/cpp/rdp/rdp_gdi_surface.cpp \
            native/cpp/rdp/rdp_channels.cpp \
            native/cpp/rdp/rdp_h264_decoder.cpp \
            native/cpp/rdp/nexusts_rdp_macos.cpp

      - name: Validate NDK & Provisioning Shell Scripts
        run: |
          bash -n scripts/build-freerdp3-ndk.sh
          bash -n scripts/provision-signing-and-oauth.sh
          bash -n scripts/setup-gdrive-oauth.sh
          ./scripts/build-freerdp3-ndk.sh --dry-run

      - name: Cache Prebuilt OpenSSL 3.4 + libusb + FreeRDP 3.12 NDK SDK
        if: ${{ inputs.compile_full_freerdp3 == true || startsWith(github.ref, 'refs/tags/v') }}
        id: freerdp-cache
        uses: actions/cache@v4
        with:
          path: |
            native/third_party/freerdp3
            protocols/rdp/src/main/jniLibs
          key: freerdp3-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('scripts/build-freerdp3-ndk.sh') }}

      - name: Build & Stage OpenSSL 3.4 + libusb + FreeRDP 3.12 (16 KB Page Aligned)
        if: ${{ (inputs.compile_full_freerdp3 == true || startsWith(github.ref, 'refs/tags/v')) && steps.freerdp-cache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bzip2 perl make autoconf automake libtool
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "ndk;${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          ./scripts/build-freerdp3-ndk.sh --abis arm64-v8a,x86_64

      - name: Upload Prebuilt FreeRDP 3.12 SDK
        if: ${{ inputs.compile_full_freerdp3 == true || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusts-freerdp3-prebuilt
          path: |
            native/third_party/freerdp3/
            protocols/rdp/src/main/jniLibs/
          if-no-files-found: error

  android-bundle-release:
    name: Android APK, Play Store AAB & Binary QA
    needs: [ rust-ndk-protocols, cpp-freerdp-bridge ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NexusTS
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK Platform 35, Build-Tools, NDK & CMake
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Download Rust JNI Shared Libraries
        uses: actions/download-artifact@v4
        with:
          name: nexusts-rust-jnilibs
          path: app/src/main/jniLibs/

      - name: Download Prebuilt FreeRDP 3.12 Libraries (if built)
        if: ${{ inputs.compile_full_freerdp3 == true || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v4
        with:
          name: nexusts-freerdp3-prebuilt
          path: .

      - name: Decode Production Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSTS_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_B64}" ]]; then
            mkdir -p "${RUNNER_TEMP}/signing"
            printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/signing/nexusts-release.p12"
            echo "NEXUSTS_KEYSTORE_PATH=${RUNNER_TEMP}/signing/nexusts-release.p12" >> "${GITHUB_ENV}"
            echo "HAS_PRODUCTION_KEYSTORE=true" >> "${GITHUB_ENV}"
          else
            echo "HAS_PRODUCTION_KEYSTORE=false" >> "${GITHUB_ENV}"
          fi

      - name: Setup Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Execute JVM Unit & Headless Robolectric Compose UI E2E Tests
        env:
          NEXUSTS_PREBUILT_RUST_JNILIBS: "true"
        run: gradle testDebugUnitTest --continue --stacktrace

      - name: Build Debug APK, Lint, Instrumentation APK & Signed Release Bundle (.aab) + APK
        env:
          NEXUSTS_PREBUILT_RUST_JNILIBS: "true"
          NEXUSTS_KEYSTORE_PASSWORD: ${{ secrets.NEXUSTS_KEYSTORE_PASSWORD }}
          NEXUSTS_KEY_ALIAS: ${{ secrets.NEXUSTS_KEY_ALIAS }}
          NEXUSTS_KEY_PASSWORD: ${{ secrets.NEXUSTS_KEY_PASSWORD }}
          NEXUSTS_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXUSTS_GOOGLE_WEB_CLIENT_ID }}
        run: |
          gradle lintDebug assembleDebug :app:assembleDebugAndroidTest --continue --stacktrace
          gradle bundleRelease --max-workers=2 --stacktrace
          gradle assembleRelease --max-workers=2 --stacktrace

      - name: Automated Play Protect, v2/v3 Signing & 16 KB ELF Page Alignment QA
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          AAPT2="${ANDROID_HOME}/build-tools/35.0.0/aapt2"
          READELF="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          RELEASE_AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          test -f "${RELEASE_APK}"
          test -f "${RELEASE_AAB}"

          echo "==> [1/4] Verifying APK Signature Scheme v3 & RSA-4096 Certificate on ${RELEASE_APK}"
          CERT_OUT="$("${APKSIGNER}" verify --verbose --print-certs "${RELEASE_APK}")"
          echo "${CERT_OUT}"
          echo "${CERT_OUT}" | grep -q "^Verifies$"
          echo "${CERT_OUT}" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          if [[ "${HAS_PRODUCTION_KEYSTORE}" == "true" ]]; then
            echo "${CERT_OUT}" | grep -qi "4abd80f12014b988091c97922f8702d1bfb7939c73b69adb1a9b76306a302782"
            echo "[OK] Production RSA-4096 upload certificate SHA-256 verified."
          fi

          echo "==> [2/4] Verifying Google Play Protect Compliance (Zero Sideloading or Broad Storage Permissions)"
          PERMS_OUT="$("${AAPT2}" dump permissions "${RELEASE_APK}")"
          echo "${PERMS_OUT}"
          if echo "${PERMS_OUT}" | grep -qE "REQUEST_INSTALL_PACKAGES|MANAGE_EXTERNAL_STORAGE"; then
            echo "FATAL: Forbidden Play Protect-sensitive permission detected!" >&2
            exit 1
          fi
          echo "[OK] Zero REQUEST_INSTALL_PACKAGES / MANAGE_EXTERNAL_STORAGE permissions — 100% Google Play Protect compliant."

          echo "==> [3/4] Verifying Package Identity & 6 Bundled Enterprise Locales"
          BADGING_OUT="$("${AAPT2}" dump badging "${RELEASE_APK}")"
          echo "${BADGING_OUT}" | grep -q "name='com.nexusts.app'"
          for loc in de el es fr it; do
            echo "${BADGING_OUT}" | grep -q "'${loc}'"
          done
          echo "[OK] Verified com.nexusts.app & 6 bundled locales (en, de, it, es, el, fr)."

          echo "==> [4/4] Verifying 16 KB (0x4000) ELF LOAD Segment Alignment on All Native .so Libraries"
          UNZIP_DIR="${RUNNER_TEMP}/apk_native_qa"
          rm -rf "${UNZIP_DIR}"
          mkdir -p "${UNZIP_DIR}"
          unzip -q "${RELEASE_APK}" "lib/*" -d "${UNZIP_DIR}"
          SO_COUNT=0
          while IFS= read -r -d '' so_file; do
            SO_COUNT=$((SO_COUNT + 1))
            echo "  Inspecting ${so_file#${UNZIP_DIR}/}"
            python3 - "${READELF}" "${so_file}" <<'PY'
          import re, subprocess, sys
          readelf, so_path = sys.argv[1], sys.argv[2]
          out = subprocess.check_output([readelf, "-W", "-l", so_path], text=True)
          loads = [line for line in out.splitlines() if line.strip().startswith("LOAD")]
          assert loads, f"No ELF LOAD segments in {so_path}"
          for line in loads:
              hex_tokens = re.findall(r"0x[0-9a-fA-F]+", line)
              align = int(hex_tokens[-1], 16)
              if align < 0x4000:
                  raise SystemExit(f"FAIL: {so_path} has LOAD segment alignment {hex(align)} < 0x4000 (16 KB)!\n{line}")
          PY
          done < <(find "${UNZIP_DIR}/lib" -name "*.so" -print0)
          test "${SO_COUNT}" -ge 4
          echo "[OK] Verified 16 KB (>= 0x4000) ELF page alignment across ${SO_COUNT} packaged .so libraries!"

      - name: Upload NexusTS Signed Release Bundle (.aab) & APKs
        uses: actions/upload-artifact@v4
        with:
          name: nexusts-googlebook-android-artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.idsig
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            certs/nexusts-upload-certificate.pem
            certs/oauth-and-mdm-registration.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Optional Play Store Track
    needs: [ android-bundle-release ]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout NexusTS
        uses: actions/checkout@v4

      - name: Download Signed Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexusts-googlebook-android-artifacts
          path: dist-raw

      - name: Stage Release Assets & SHA-256 Checksums
        id: stage
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${TAG_NAME}" != v* ]]; then
            TAG_NAME="${{ inputs.release_tag || 'v0.8.11' }}"
          fi
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

          mkdir -p release-assets
          cp "$(find dist-raw -path '*/apk/release/*.apk' | head -n 1)" \
            "release-assets/NexusTS-${TAG_NAME}-googlebook-android-release.apk"
          cp "$(find dist-raw -path '*/bundle/release/*.aab' | head -n 1)" \
            "release-assets/NexusTS-${TAG_NAME}-playstore-release.aab"
          cp "$(find dist-raw -path '*/apk/debug/*.apk' | head -n 1)" \
            "release-assets/NexusTS-${TAG_NAME}-debug.apk"
          if compgen -G "dist-raw/**/apk/release/*.idsig" > /dev/null; then
            cp "$(find dist-raw -path '*/apk/release/*.idsig' | head -n 1)" \
              "release-assets/NexusTS-${TAG_NAME}-googlebook-android-release.apk.idsig"
          fi
          cp certs/nexusts-upload-certificate.pem release-assets/
          cp certs/oauth-and-mdm-registration.json release-assets/
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Publish GitHub Release (${{ steps.stage.outputs.tag_name }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag_name }}
          name: "NexusTS ${{ steps.stage.outputs.tag_name }} — Reliable Bidirectional RDP Text & File Copy-Paste (CLIPRDR + macOS ⌘C/⌘V)"
          draft: false
          prerelease: ${{ contains(steps.stage.outputs.tag_name, '-') }}
          generate_release_notes: true
          body: |
            ## NexusTS ${{ steps.stage.outputs.tag_name }} (`com.nexusts.app` / `com.nexusts.app.macos`)
            **Native Remote Management & Connection Manager for Googlebook OS, Android Tablets & macOS**

            > **Bidirectional RDP Text & File Copy-Paste Fix Release (`0.8.11` / `versionCode = 10811`)**: Resolves **MS-RDPECLIP (`CLIPRDR`)** protocol regressions and macOS **`⌘C` / `⌘V` / Edit menu** shortcut collisions so both **UTF-8/Unicode text** and **raw binary files & folders** (`.csv`, `.txt`, `.exe`, multi-GB installers, 0-byte files, symlinks, and nested folders) copy and paste reliably in both directions without Finder `.textClipping` artifacts.

            ### Signed Deliverables (100% In-Place Upgrade Compatible)
            - **`NexusTS-${{ steps.stage.outputs.tag_name }}-googlebook-android-release.apk`**: Cryptographically signed (APK Signature Scheme v2/v3/v4, RSA-4096) universal `arm64-v8a` + `x86_64` APK with 16 KB ELF page alignment (`0x4000`) and 100% Google Play Protect compliance (`versionCode = 10811`).
            - **`NexusTS-${{ steps.stage.outputs.tag_name }}-playstore-release.aab`**: Signed Android App Bundle for optional Managed Google Play / internal distribution.
            - **`NexusTS-${{ steps.stage.outputs.tag_name }}-macOS-Universal.zip` & `.dmg`**: Self-contained Universal2 (`arm64` + `x86_64`) macOS application bundle statically linking OpenSSL 3.4.1 + Cisco OpenH264 2.5.0 + FreeRDP 3.12.0 (`.zip` powers one-click in-app updates without downloading a `.dmg`).
            - **`nexusts-upload-certificate.pem` & `oauth-and-mdm-registration.json`**: Public X.509 upload certificate (`SHA-1: A6:AF:15:A9:BF:0B:FE:38:D4:66:46:3E:3E:72:A6:5B:4F:9C:4D:F6`, `SHA-256: 4A:BD:80:F1:20:14:B9:88:09:1C:97:92:2F:87:02:D1:BF:B7:93:9C:73:B6:9A:DB:1A:9B:76:30:6A:30:27:82`) and Managed Google Play `app_restrictions` template.

            ### Highlights in ${{ steps.stage.outputs.tag_name }}
            - **MS-RDPECLIP (`CLIPRDR`) File & Text Fixes (`Windows <-> macOS/Android`)**:
              - **Eliminated Client-Fabricated `CB_LOCK_CLIPDATA` (`clipDataId`)**: Aligns client capability negotiation and `FileContentsRequest` PDUs with upstream FreeRDP 3.12 (`client_cliprdr_file.c`), fixing Windows `rdpclip.exe` rejecting file transfers and leaving stale text on `NSPasteboard` (which previously caused Finder `⌘V` to create `.textClipping` files).
              - **Direct `FILECONTENTS_RANGE` for Known-Size Files + Hybrid Text Fallback**: Immediately streams `1 MiB` `FILECONTENTS_RANGE` chunks when `FD_FILESIZE > 0` (matching FreeRDP Apple `apple_download_file`), retains `FILECONTENTS_SIZE` discovery for virtual/0-byte items, tracks `client_requested_format_id_` independently from FreeRDP's overwritten `lastRequestedFormatId`, and automatically falls back to `CF_UNICODETEXT` when hybrid Windows apps (Excel/Outlook/OneNote/Teams) advertise synthetic `FileGroupDescriptorW`.
              - **Decoupled Local & Remote Clipboard State**: Incoming `ServerFormatList` PDUs no longer wipe queued local text or file payloads before Windows issues `ServerFormatDataRequest`.
            - **macOS `⌘C` / `⌘V`, `Edit` Menu & Focus Restoration**:
              - **Stopped Bare `⌘` from Holding `VK_LWIN`**: Pressing `⌘C` / `⌘V` / `⌘X` / `⌘A` / `⌘Z` in an RDP session now sends clean `Ctrl+<Key>` scancodes without `Win+C` / `Win+V` collisions (and `⌘Tab` no longer opens the Windows Start Menu; added a dedicated **Start** HUD button alongside `Win+<Key>` combos).
              - **Native macOS `Edit` Menu & Automatic Focus Recovery**: Wires `Edit -> Copy / Paste / Cut / Select All / Undo / Redo` directly to active RDP and SSH/Terminal views while preserving standard `NSText` editing in text fields and sheets, and syncs `NSPasteboard.general` on window activation/deactivation.
          files: release-assets/*

      - name: Check Optional Google Play Service Account Secret
        id: play-check
        env:
          PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "${PLAY_SA_JSON}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload Signed AAB & 6-Locale Metadata to Google Play Internal Track
        if: ${{ steps.play-check.outputs.enabled == 'true' && !contains(steps.stage.outputs.tag_name, '-') }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nexusts.app
          releaseFiles: release-assets/NexusTS-${{ steps.stage.outputs.tag_name }}-playstore-release.aab
          track: internal
          whatsNewDirectory: fastlane/metadata/android
