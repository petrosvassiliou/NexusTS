name: NexusTS ChromeOS Offline PWA & Isolated Web App (.swbn) CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish ChromeOS .swbn, Offline PWA .zip & Linux Relay to GitHub Releases"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Tag name when publishing via workflow_dispatch"
        required: false
        default: "v1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: nexusts-chromeos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify-chromeos:
    name: Build Wasm, Local Relay, Offline PWA & Signed .swbn IWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NexusTS
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (wasm32 + x86_64/aarch64 Linux)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install aarch64 Cross-Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross zip

      - name: Cache ChromeOS Rust Registry & Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            chromeos-pwa/rust/target
          key: ${{ runner.os }}-cargo-chromeos-${{ hashFiles('chromeos-pwa/rust/**/Cargo.toml', 'native/rust/**/Cargo.toml') }}

      - name: Run Rust Unit Tests (nexusts-wasm & nexusts-relay)
        working-directory: chromeos-pwa/rust
        run: cargo test --workspace

      - name: Build Zero-Import WebAssembly Accelerator (nexusts_wasm.wasm)
        working-directory: chromeos-pwa/rust
        run: |
          cargo build -p nexusts-wasm --target wasm32-unknown-unknown --release
          mkdir -p ../app/wasm
          cp target/wasm32-unknown-unknown/release/nexusts_wasm.wasm ../app/wasm/nexusts_wasm.wasm
          ls -lh ../app/wasm/nexusts_wasm.wasm

      - name: Build Companion Local Relay Binaries (x86_64 & arm64 for ChromeOS Crostini)
        working-directory: chromeos-pwa/rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build -p nexusts-relay --target x86_64-unknown-linux-gnu --release
          cargo build -p nexusts-relay --target aarch64-unknown-linux-gnu --release
          ./target/x86_64-unknown-linux-gnu/release/nexusts-local-relay --self-test | grep -q "NEXUSTS_RELAY_SELF_TEST_OK version=1.0.0"

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Official WebBundle Tooling & Run ChromeOS QA Suite
        working-directory: chromeos-pwa
        run: |
          npm ci
          npm test

      - name: Build Signed Isolated Web App (.swbn) & Offline PWA (.zip)
        working-directory: chromeos-pwa
        env:
          NEXUSTS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v1.0.0' }}
          NEXUSTS_IWA_ED25519_PEM: ${{ secrets.NEXUSTS_IWA_ED25519_PEM }}
        run: |
          npm run build
          TAG="${NEXUSTS_RELEASE_TAG}"
          cp rust/target/x86_64-unknown-linux-gnu/release/nexusts-local-relay "dist/nexusts-local-relay-${TAG}-linux-x86_64"
          cp rust/target/aarch64-unknown-linux-gnu/release/nexusts-local-relay "dist/nexusts-local-relay-${TAG}-linux-arm64"
          chmod +x "dist/nexusts-local-relay-${TAG}-linux-x86_64" "dist/nexusts-local-relay-${TAG}-linux-arm64"
          (
            cd dist
            sha256sum * > SHA256SUMS-chromeos.txt
            cat SHA256SUMS-chromeos.txt
          )

      - name: Upload ChromeOS IWA (.swbn), Offline PWA (.zip) & Relay Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusTS-ChromeOS-Bundles
          path: chromeos-pwa/dist/*
          if-no-files-found: error

  publish-chromeos-release:
    name: Publish ChromeOS IWA (.swbn) & Offline PWA to GitHub Release
    needs: [ build-and-verify-chromeos ]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ChromeOS Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NexusTS-ChromeOS-Bundles
          path: release-assets-chromeos

      - name: Resolve Release Tag
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${TAG_NAME}" != v* ]]; then
            TAG_NAME="${{ inputs.release_tag || 'v1.0.0' }}"
          fi
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Attach ChromeOS Deliverables to GitHub Release (${{ steps.tag.outputs.tag_name }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag_name, '-') }}
          generate_release_notes: true
          files: release-assets-chromeos/*
