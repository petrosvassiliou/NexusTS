name: Deploy ChromeOS PWA to Firebase Hosting

on:
  push:
    branches:
      - main
      - 'beta*'
    tags:
      - 'v*'
    paths:
      - 'chromeos-pwa/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-chromeos-pwa.yml'
  workflow_dispatch:

concurrency:
  group: nexusts-firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build & Deploy ChromeOS Start-Menu PWA (nexusts-prod)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'nexusts-prod' }}
      NEXUSTS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9.4' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Wasm Target (wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache ChromeOS Wasm Rust Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            chromeos-pwa/rust/target
          key: ${{ runner.os }}-cargo-nexusts-wasm-${{ hashFiles('chromeos-pwa/rust/**/Cargo.toml') }}

      - name: Build Zero-Import WebAssembly Accelerator (nexusts_wasm.wasm)
        working-directory: chromeos-pwa/rust
        run: |
          cargo build -p nexusts-wasm --target wasm32-unknown-unknown --release
          mkdir -p ../app/wasm
          cp target/wasm32-unknown-unknown/release/nexusts_wasm.wasm ../app/wasm/nexusts_wasm.wasm

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run ChromeOS PWA QA Suite & Build Firebase Hosting Bundle
        working-directory: chromeos-pwa
        run: |
          npm test
          npm run build:hosting

      - name: Upload ChromeOS PWA Hosting Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusts-chromeos-pwa-dist
          path: chromeos-pwa/hosting-dist
          if-no-files-found: error

      - name: Authenticate to Google Cloud via Keyless Workload Identity Federation (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER || 'projects/846203112751/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc' }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT || 'github-action-nexusts@nexusts-prod.iam.gserviceaccount.com' }}

      - name: Deploy Stable to Firebase Hosting Live Channel (nexusts-prod)
        if: >-
          github.ref == 'refs/heads/main' ||
          (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
        run: |
          npx --yes firebase-tools deploy --only hosting --project "${FIREBASE_PROJECT_ID}"

      - name: Deploy Beta to Isolated Firebase Preview Channel (beta)
        if: >-
          github.ref != 'refs/heads/main' &&
          (!startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-'))
        run: |
          npx --yes firebase-tools hosting:channel:deploy beta --expires 30d --project "${FIREBASE_PROJECT_ID}"
