name: Deploy ChromeOS PWA (GitHub Pages & Firebase Hosting)

on:
  push:
    branches:
      - main
      - 'beta*'
    tags:
      - 'v*'
    paths:
      - 'chromeos-pwa/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-chromeos-pwa.yml'
  workflow_dispatch:

concurrency:
  group: nexusts-chromeos-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_pwa:
    name: Build ChromeOS Start-Menu PWA + Rust Wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      NEXUSTS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9.1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Wasm Target (wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache ChromeOS Wasm Rust Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            chromeos-pwa/rust/target
          key: ${{ runner.os }}-cargo-nexusts-wasm-${{ hashFiles('chromeos-pwa/rust/**/Cargo.toml') }}

      - name: Build Zero-Import WebAssembly Accelerator (nexusts_wasm.wasm)
        working-directory: chromeos-pwa/rust
        run: |
          cargo build -p nexusts-wasm --target wasm32-unknown-unknown --release
          mkdir -p ../app/wasm
          cp target/wasm32-unknown-unknown/release/nexusts_wasm.wasm ../app/wasm/nexusts_wasm.wasm

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run ChromeOS PWA QA Suite & Build Hosting Bundle
        working-directory: chromeos-pwa
        run: |
          npm test
          npm run build:hosting

      - name: Upload ChromeOS PWA Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusts-chromeos-pwa-dist
          path: chromeos-pwa/hosting-dist
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: >-
          github.ref == 'refs/heads/main' ||
          (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: >-
          github.ref == 'refs/heads/main' ||
          (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: chromeos-pwa/hosting-dist

  deploy_github_pages:
    name: Deploy Live ChromeOS PWA to GitHub Pages
    needs: [ build_pwa ]
    if: >-
      github.ref == 'refs/heads/main' ||
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_firebase_optional:
    name: Deploy to Firebase Hosting (Optional if OIDC Configured)
    needs: [ build_pwa ]
    if: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'nexusts-prod' }}
    steps:
      - name: Checkout firebase.json & .firebaserc
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            firebase.json
            .firebaserc

      - name: Download Built ChromeOS PWA Bundle
        uses: actions/download-artifact@v4
        with:
          name: nexusts-chromeos-pwa-dist
          path: chromeos-pwa/hosting-dist

      - name: Authenticate to Google Cloud via Keyless OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Stable to Firebase Hosting Live Channel
        if: >-
          github.ref == 'refs/heads/main' ||
          (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
        run: npx --yes firebase-tools deploy --only hosting --project "${FIREBASE_PROJECT_ID}"

      - name: Deploy Beta to Isolated Firebase Preview Channel
        if: >-
          github.ref != 'refs/heads/main' &&
          (!startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-'))
        run: npx --yes firebase-tools hosting:channel:deploy beta --expires 30d --project "${FIREBASE_PROJECT_ID}"
