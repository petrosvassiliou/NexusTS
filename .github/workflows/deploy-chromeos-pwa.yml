name: Deploy ChromeOS PWA to Firebase Hosting

on:
  push:
    branches:
      - main
      - 'beta*'
    tags:
      - 'v*'
    paths:
      - 'chromeos-pwa/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-chromeos-pwa.yml'
  workflow_dispatch:

concurrency:
  group: nexusts-firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build & Deploy ChromeOS Start-Menu PWA (Firebase Hosting)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'nexusts-prod' }}
      NEXUSTS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9.1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Wasm Target (wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache ChromeOS Wasm Rust Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            chromeos-pwa/rust/target
          key: ${{ runner.os }}-cargo-nexusts-wasm-${{ hashFiles('chromeos-pwa/rust/**/Cargo.toml') }}

      - name: Build Zero-Import WebAssembly Accelerator (nexusts_wasm.wasm)
        working-directory: chromeos-pwa/rust
        run: |
          cargo build -p nexusts-wasm --target wasm32-unknown-unknown --release
          mkdir -p ../app/wasm
          cp target/wasm32-unknown-unknown/release/nexusts_wasm.wasm ../app/wasm/nexusts_wasm.wasm

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run ChromeOS PWA QA Suite & Build Firebase Hosting Bundle
        working-directory: chromeos-pwa
        run: |
          npm test
          npm run build:hosting

      - name: Upload ChromeOS PWA Hosting Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusts-chromeos-pwa-dist
          path: chromeos-pwa/hosting-dist
          if-no-files-found: error

      - name: Check Firebase GCP OIDC Configuration
        id: check_auth
        env:
          WIF_PROVIDER: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SA}" ]]; then
            echo "mode=oidc" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${SA_JSON}" ]]; then
            echo "mode=sa_json" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=unconfigured" >> "${GITHUB_OUTPUT}"
            {
              echo "### Firebase Hosting Setup Pending"
              echo "ChromeOS PWA bundle verified and uploaded as \`nexusts-chromeos-pwa-dist\`."
              echo "Run \`./scripts/setup-firebase-hosting.sh nexusts-prod\` once locally to provision Firebase Hosting + Keyless GitHub OIDC (\`https://nexusts-prod.web.app/\`)."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Authenticate to Google Cloud via Keyless Workload Identity Federation (OIDC)
        if: steps.check_auth.outputs.mode == 'oidc'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud via Service Account JSON Fallback
        if: steps.check_auth.outputs.mode == 'sa_json'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Stable to Firebase Hosting Live Channel (${{ env.FIREBASE_PROJECT_ID }})
        if: >-
          steps.check_auth.outputs.mode != 'unconfigured' &&
          (github.ref == 'refs/heads/main' ||
          (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')))
        run: |
          npx --yes firebase-tools deploy --only hosting --project "${FIREBASE_PROJECT_ID}"
          echo "### Deployed Live ChromeOS Start-Menu PWA: https://${FIREBASE_PROJECT_ID}.web.app/" >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy Beta to Isolated Firebase Preview Channel (beta)
        if: >-
          steps.check_auth.outputs.mode != 'unconfigured' &&
          github.ref != 'refs/heads/main' &&
          (!startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-'))
        run: |
          npx --yes firebase-tools hosting:channel:deploy beta --expires 30d --project "${FIREBASE_PROJECT_ID}"
